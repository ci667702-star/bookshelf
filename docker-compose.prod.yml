# 배포용: 앱(API + 웹 화면) + PostgreSQL 을 한 번에 실행
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# 설정값은 .env.production 에 (.env.production.example 참고)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RDB_USERNAME:-bookmoment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env.production 에 POSTGRES_PASSWORD 를 넣어 주세요}
      POSTGRES_DB: ${RDB_DATABASE:-bookmoment}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 위에서 정한 사용자 · DB 이름 그대로 확인 ($$ 는 컨테이너 안의 환경변수)
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    # DB 포트는 바깥에 열지 않는다 (앱 컨테이너만 접속)

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      # RDB_URL 을 넣으면 그 DB(예: 외부 RDS)를 쓰고, 비워 두면 위 db 컨테이너 주소를 자동으로 만든다
      DATABASE_URL: ${RDB_URL:-postgresql://${RDB_USERNAME:-bookmoment}:${POSTGRES_PASSWORD}@db:5432/${RDB_DATABASE:-bookmoment}?schema=public}
      UPLOAD_DIR: uploads
    ports:
      # 기본은 서버 안에서만 접속 가능(127.0.0.1) → 앞단의 Caddy/Nginx 가 https 로 연결
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-4000}:4000"
    volumes:
      - uploads:/app/backend/uploads

volumes:
  pgdata:
  uploads:

networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: 1400
